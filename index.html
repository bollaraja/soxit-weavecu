  const path = resolvePath();
  document.getElementById('utilitybar').innerHTML='';
  document.getElementById('site-header').innerHTML = renderHeader();
  document.getElementById('site-footer').innerHTML = renderFooter();
  let html = null;
  for(const [re, fn] of ROUTES){
    const m = path.match(re);
    if(m){ html = fn(m); break; }
  }
  document.getElementById('app').innerHTML = html || page404();
  window.scrollTo({top:0,behavior:'instant'});
  lucide.createIcons();
  bindHeaderEvents();
}
function bindHeaderEvents(){
  const dt = document.getElementById('darkToggle');
  if(dt) dt.onclick = ()=>{
    window.STATE.dark = !window.STATE.dark;
    document.documentElement.classList.toggle('dark', window.STATE.dark);
    const dl = document.getElementById('darkLabel');
    if(dl) dl.textContent = window.STATE.dark ? 'Light' : 'Dark';
  };
  const mb = document.getElementById('mobileNavBtn');
  const mn = document.getElementById('mobileNav');
  if(mb && mn) mb.onclick = ()=> mn.classList.toggle('hidden');
  document.querySelectorAll('.mobile-acc-btn').forEach(btn=>{
    btn.onclick = ()=>{
      const panel = document.querySelector(`.mobile-acc-panel[data-panel="${btn.dataset.acc}"]`);
      const chev = btn.querySelector('[data-lucide]');
      if(panel) panel.classList.toggle('hidden');
      if(chev) chev.classList.toggle('rotate-180');
    };
  });
}
window.addEventListener('hashchange', render);
window.addEventListener('DOMContentLoaded', render);
</script>
</body>
</html>
